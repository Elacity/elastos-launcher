<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>ElastOS</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div id="window-content">
    <div class="title-bar" aria-hidden="true"></div>
    <main aria-labelledby="title">
      <img class="app-mark" src="elastos-icon-default.svg" alt="" width="64" height="64">
      <h1 id="title">ElastOS</h1>
      <p id="message" role="status" aria-live="polite" hidden></p>
      <label id="login-row"><input id="login" type="checkbox" checked> Start Home at Login</label>
      <p id="location" hidden></p>
      <a id="release-notes" href="#" hidden>What's new</a>
      <progress id="progress" aria-label="Installation progress" hidden></progress>
      <div id="actions"><button id="cancel" hidden>Not Now</button><button id="primary" type="button">Install</button></div>
      <button id="diagnostics" class="text-button" hidden>Copy Diagnostics</button>
    </main>
  </div>
</body>
</html>
