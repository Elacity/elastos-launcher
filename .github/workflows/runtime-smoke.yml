name: Runtime smoke

# Linux x64, macOS arm64, and the ElastOS WSL2 distro are required.
# A red run fails the pull request. Each job verifies the selected channel
# against the maintainer DID and rollback floor. Failed verification means
# install stops. The job then checks gateway /healthz and
# /home/. The Windows job imports distro ElastOS as WSL2. It does not skip.
on:
  pull_request:
  workflow_dispatch:

jobs:
  mac-dialogs:
    name: packaged dialog hit regions (mac)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Package the pinned failing source
        run: |
          git fetch --depth=1 origin a66ca520bfe48a5ad916f954442a61cce3e7dda6
          mkdir "$RUNNER_TEMP/launcher-baseline"
          git archive a66ca520bfe48a5ad916f954442a61cce3e7dda6 | tar -x -C "$RUNNER_TEMP/launcher-baseline"
          cd "$RUNNER_TEMP/launcher-baseline"
          npm ci
          npm run build:mac -- --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NOTARIZE_MAC: 'false'
      - name: Reproduce drag-covered controls on a66ca52
        run: node scripts/mac-dialog-e2e.js "$RUNNER_TEMP/launcher-baseline/dist-electron/mac-arm64/ElastOS.app" --expect-drag

  smoke:
    name: smoke (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require Apple silicon for the Mac lane
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install pinned runtime and require a healthy Home
        run: bash scripts/runtime-smoke.sh

  windows-wsl:
    name: smoke (windows-wsl)
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import the ElastOS WSL2 distro and require /healthz
        shell: pwsh
        run: pwsh -File scripts/windows-elastos-distro.ps1

  electron-e2e:
    name: e2e (${{ matrix.platform }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Require Apple silicon for the Mac lane
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgtk-3-0t64 libxss1

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Click Install and reach Open my computer
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELASTOS_LAUNCH_TARGET: runtime
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run e2e
          else
            npm run e2e
          fi

      - name: Offer Remove PC2 for a seeded v1.4.0 home
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" node scripts/legacy-upgrade-e2e.js
          else
            node scripts/legacy-upgrade-e2e.js
          fi

  electron-e2e-windows:
    name: e2e (windows)
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Click Install and reach Open my computer
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELASTOS_LAUNCH_TARGET: runtime
          DEBUG: pw:browser
        run: npm run e2e

  windows-app:
    name: app install (windows-wsl)
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Compile
        run: npx tsc

      - name: Install inside the ElastOS distro, require /healthz, then Reset, Uninstall, and restore the saved copy
        run: node scripts/windows-app-install.js

  clean-machine-linux:
    name: clean machine (ubuntu)
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Compile
        run: npx tsc

      - name: Install on Ubuntu without curl, python3, or gcc
        run: bash scripts/clean-machine-linux.sh

  clean-machine-windows:
    name: clean machine (windows-wsl)
    timeout-minutes: 20
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Compile
        run: npx tsc

      - name: Record WSL state and the reboot message
        shell: pwsh
        run: pwsh -File scripts/windows-clean-machine.ps1
