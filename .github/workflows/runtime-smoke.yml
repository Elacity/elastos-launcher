name: Runtime smoke

# Linux x64, macOS arm64, and the ElastOS WSL2 distro are required.
# A red run fails the pull request. Each job installs the active pin
# (canary until stable is published). If that pin does not match the
# publisher, install stops. The job then checks gateway /healthz and
# /home/. The Windows job imports distro ElastOS as WSL2. It does not skip.
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned runtime and require a healthy Home
        run: bash scripts/runtime-smoke.sh

  windows-wsl:
    name: smoke (windows-wsl)
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import the ElastOS WSL2 distro and require /healthz
        shell: pwsh
        run: pwsh -File scripts/windows-elastos-distro.ps1
