name: Runtime smoke

# Non-blocking. A red run does not fail the pull request.
# Installs the testing pin (canary) or falls back to the hosted installer,
# then checks gateway /healthz and /home/.
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.platform }})
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned runtime and require a healthy Home
        run: bash scripts/runtime-smoke.sh
