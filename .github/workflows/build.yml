name: Build ElastOS Launcher

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.1, v1.0.0
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to run'
        type: choice
        options: [none, mac, linux, windows, all]
        default: none
      notarize:
        description: 'Try Apple notarization for this test build (failure is nonblocking)'
        type: boolean
        default: false

# Grant write permissions for creating releases
permissions:
  contents: write

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: node scripts/ci-plan.js
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}

  build:
    needs: [plan]
    if: needs.plan.outputs.platforms != '[]'
    strategy:
      fail-fast: false  # Don't cancel other builds if one fails
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MAC_RELEASE_STRICT: ${{ startsWith(github.ref, 'refs/tags/') }}
      NOTARIZE_MAC: ${{ startsWith(github.ref, 'refs/tags/') || inputs.notarize == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows/Linux
        if: matrix.platform != 'mac'
        run: npm run build:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for macOS (with signing)
        id: signed_mac
        if: matrix.platform == 'mac'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required credential $name"; exit 1; }
          done
          npm run build:mac -- --arm64 --publish never -c.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS test app with ad-hoc signing
        if: matrix.platform == 'mac' && steps.signed_mac.outcome == 'failure' && !startsWith(github.ref, 'refs/tags/')
        run: npm run build:mac -- --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS code signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          APP_PATH="dist-electron/mac-arm64/ElastOS.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1
          node scripts/verify-mac-app.js "$APP_PATH"
          if [[ "$MAC_RELEASE_STRICT" == true && "$NOTARIZE_MAC" == true ]]; then
            spctl -a -vv "$APP_PATH"
          fi
          for dmg in dist-electron/*.dmg; do
            if [[ "$MAC_RELEASE_STRICT" == true && "$NOTARIZE_MAC" == true ]]; then
              xcrun stapler validate "$dmg"
            fi
            shasum -a 256 "$dmg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ElastOS-${{ matrix.platform }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: error

  linux-arm64:
    needs: [plan]
    if: contains(needs.plan.outputs.platforms, 'linux')
    uses: ./.github/workflows/linux-arm64.yml
    with:
      platforms: linux

  release:
    needs: [plan, build, linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.plan.outputs.platforms != '[]'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
