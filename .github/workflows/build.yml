name: Build ElastOS Launcher

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.1, v1.0.0
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Try Apple notarization for this test build (failure is nonblocking)'
        type: boolean
        default: false

# Grant write permissions for creating releases
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other builds if one fails
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MAC_RELEASE_STRICT: ${{ startsWith(github.ref, 'refs/tags/') }}
      NOTARIZE_MAC: ${{ startsWith(github.ref, 'refs/tags/') || inputs.notarize == true || vars.NOTARIZE_MAC == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows/Linux
        if: matrix.platform != 'mac'
        run: npm run build:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for macOS (with signing)
        id: signed_mac
        if: matrix.platform == 'mac'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required credential $name"; exit 1; }
          done
          npm run build:mac -- --arm64 --publish never -c.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS test app with ad-hoc signing
        if: matrix.platform == 'mac' && steps.signed_mac.outcome == 'failure' && !startsWith(github.ref, 'refs/tags/')
        run: npm run build:mac -- --arm64 --publish never -c.mac.identity=- -c.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS code signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          APP_PATH="dist-electron/mac-arm64/ElastOS.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1
          if [[ "$MAC_RELEASE_STRICT" == true ]]; then
            spctl -a -vv "$APP_PATH"
          fi
          for dmg in dist-electron/*.dmg; do
            if [[ "$MAC_RELEASE_STRICT" == true ]]; then
              xcrun stapler validate "$dmg"
            fi
            shasum -a 256 "$dmg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ElastOS-${{ matrix.platform }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
